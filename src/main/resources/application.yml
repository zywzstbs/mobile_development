server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 9MB
    max-swallow-size: 9MB

spring:
  application:
    name: gulupai-server
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gulupai}
    username: ${DB_USERNAME:gulupai}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    time-zone: UTC
    default-property-inclusion: always
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:0.1.0-P16}
  files:
    root: ${APP_FILES_ROOT:${java.io.tmpdir}/gulupai-files}
    public-base-url: ${APP_FILES_PUBLIC_BASE_URL:https://localhost}
    minimum-free-bytes: ${APP_FILES_MIN_FREE_BYTES:0}
    reconcile-initial-delay-ms: ${APP_FILES_RECONCILE_INITIAL_DELAY_MS:3600000}
    reconcile-delay-ms: ${APP_FILES_RECONCILE_DELAY_MS:3600000}
  api:
    max-json-bytes: 1048576
    max-response-bytes: 2097152
    max-collection-bytes: 1835008
  clock:
    fixed-instant: ${APP_FIXED_INSTANT:}
  auth:
    access-ttl: 30m
    refresh-ttl: 7d
    bcrypt-cost: 10
    login-max-failures: 5
    login-window: 15m
    login-block: 15m
  idempotency:
    encryption-key: ${IDEMPOTENCY_ENCRYPTION_KEY:}
    key-id: ${IDEMPOTENCY_KEY_ID:local-dev-v1}
    retention-days: 7
  registration:
    enabled: ${REGISTRATION_ENABLED:false}
    teacher-application-enabled: ${REGISTRATION_TEACHER_ENABLED:false}
    fingerprint-key: ${REGISTRATION_FINGERPRINT_KEY:}
    key-id: ${REGISTRATION_KEY_ID:local-dev-v1}
    receipt-ttl: 7d
    max-per-account: 5
    max-per-ip: 20
    window: 15m

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request-id}] %logger{40} - %msg%n"
  level:
    root: INFO
    cn.gulupai.server: INFO
